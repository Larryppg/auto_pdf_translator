[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pdf-translation-workflow"
version = "0.1.0"
description = "A reliable watched-folder workflow for translating PDFs, including text inside images."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "Pillow>=10.3,<12",
  "PyMuPDF>=1.24,<2",
  "onnxruntime>=1.20,<2",
  "rapidocr>=3.9,<4",
  "watchdog>=4,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
pdf-translator = "pdf_translation_workflow.cli:main"
pdf-translator-gui = "pdf_translation_workflow.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_translation_workflow"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
